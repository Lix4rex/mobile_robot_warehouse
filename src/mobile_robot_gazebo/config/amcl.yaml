# Localisation AMCL sur la carte sauvegardée, d'après la section amcl de
# nav2_bringup/params/nav2_params.yaml adaptée au Tugbot
amcl:
  ros__parameters:
    use_sim_time: true

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    tf_broadcast: true  # publie map -> odom
    transform_tolerance: 1.0

    # Scan 360° du VLP-16, celui qui a servi à construire la carte
    scan_topic: /scan_omni/scan
    map_topic: /map
    laser_model_type: likelihood_field
    laser_min_range: 0.6
    laser_max_range: 25.0  # comme slam_toolbox (config/slam_toolbox.yaml)
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    lambda_short: 0.1
    do_beamskip: false

    # Bruit du modèle de mouvement (odométrie EKF roues + IMU)
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    # Mise à jour du filtre tous les 25 cm ou 0.2 rad
    update_min_d: 0.25
    update_min_a: 0.2
    save_pose_rate: 0.5

    # Le robot démarre toujours à l'origine de la carte (son point de départ
    # pendant la cartographie) : localisé dès le lancement, sans 2D Pose Estimate
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    first_map_only: false
