# Pont ROS 2 <-> Gazebo (Tugbot dans le monde world_demo)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# /cmd_vel et l'odométrie des roues passent par le diff_drive_controller
# (ros2_control), pas par le bridge ; odom -> base_link vient de robot_localization

# Vérité terrain (OdometryPublisher ajouté dans le monde) : pose réelle du
# robot dans world_demo, volontairement hors de /tf
- ros_topic_name: "/ground_truth_pose"
  gz_topic_name: "/model/tugbot/ground_truth/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# /joint_states est publié par joint_state_broadcaster (roues)
- ros_topic_name: "/gripper/joint_states"
  gz_topic_name: "/world/world_demo/model/tugbot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ===================== Lidars =====================
- ros_topic_name: "/scan"
  gz_topic_name: "/world/world_demo/model/tugbot/link/scan_front/sensor/scan_front/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/scan_back"
  gz_topic_name: "/world/world_demo/model/tugbot/link/scan_back/sensor/scan_back/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Lidar 3D (VLP-16) : nuage de points uniquement, le LaserScan n'a pas de sens en multi-nappes
- ros_topic_name: "/scan_omni/points"
  gz_topic_name: "/world/world_demo/model/tugbot/link/scan_omni/sensor/scan_omni/scan/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Lidar de contact du crochet d'attelage
- ros_topic_name: "/gripper/contact_scan"
  gz_topic_name: "/world/world_demo/model/tugbot/link/gripper/sensor/sensor_contact/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

