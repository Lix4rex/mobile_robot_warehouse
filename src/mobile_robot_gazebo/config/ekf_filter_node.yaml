ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true            # robot au sol : ignore Z, roll, pitch
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Odométrie des roues : vitesses uniquement
    odom0: /wheel/odometry
    odom0_config: [false, false, false,   # X, Y, Z
                   false, false, false,   # roll, pitch, yaw
                   true,  true,  false,   # Ẋ, Ẏ, Ż
                   false, false, true,    # roll˙, pitch˙, yaw˙
                   false, false, false]   # Ẍ, Ÿ, Z̈

    # IMU : vitesse de rotation + accélération avant
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,    # mettre yaw à true si magnétomètre fiable
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_remove_gravitational_acceleration: true