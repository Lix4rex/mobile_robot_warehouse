# Contrôleurs ros2_control du Tugbot, chargés par les spawners de gazebo.launch.py
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

diff_drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController

    left_wheel_names: [wheel_left_joint]
    right_wheel_names: [wheel_right_joint]
    # Valeurs reprises de l'ancien plugin DiffDrive de Gazebo
    wheel_separation: 0.5514
    wheel_radius: 0.195

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    # odom -> base_link est publiée par robot_localization
    enable_odom_tf: false

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]

    cmd_vel_timeout: 0.5
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
