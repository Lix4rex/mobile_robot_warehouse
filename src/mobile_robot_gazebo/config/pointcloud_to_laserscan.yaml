# Tranche horizontale du nuage du VLP-16 (/scan_omni/points) convertie en
# LaserScan 360° (/scan_omni/scan) pour slam_toolbox
pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true

    # Hauteurs exprimées dans le repère du capteur, monté à 0.53 m du sol :
    # garde de 0.13 m à 0.93 m au-dessus du sol. Le VLP-16 n'a pas de nappe à 0°
    # (nappes à ±1°, ±3°, ..., ±15°) : ±0.4 m laisse les nappes à ±1° jusqu'à ~23 m
    # tout en excluant le sol (atteint à -0.53 m)
    target_frame: ''
    min_height: -0.4
    max_height: 0.4

    # 900 points par tour sur 360° (models/tugbot/model.sdf)
    angle_min: -3.141592654
    angle_max: 3.141592654
    angle_increment: 0.006981317
    scan_time: 0.1

    # range_min exclut la carrosserie du robot autour du capteur
    range_min: 0.6
    range_max: 30.0
    use_inf: true
    transform_tolerance: 0.01
